<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>یومِ آزادی — Pakistan Independence Day Countdown</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Nastaliq+Urdu:wght@400;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --green-deep:   #012b12;
    --green:        #01411C;
    --green-light:  #0a5c2a;
    --cream:        #F7F1E1;
    --gold:         #D4A017;
    --gold-light:   #F0C64B;
    --white:        #FFFFFF;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    background: radial-gradient(ellipse 120% 80% at 50% -10%, var(--green-light) 0%, var(--green) 45%, var(--green-deep) 100%);
    color: var(--cream);
    font-family:'Inter', sans-serif;
    overflow-x:hidden;
  }

  /* ---------- starfield ---------- */
  #stars{
    position:fixed; inset:0; z-index:0; pointer-events:none;
  }
  .star{
    position:absolute; width:2px; height:2px; background:var(--cream);
    border-radius:50%; opacity:0.5;
    animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.15; transform:scale(1); }
    50%{ opacity:.9; transform:scale(1.6); }
  }

  .page{
    position:relative; z-index:1;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    justify-content:center;
    text-align:center;
    padding: 6vh 6vw;
  }

  /* ---------- eyebrow ---------- */
  .eyebrow{
    display:flex; align-items:center; justify-content:center;
    letter-spacing:.28em; text-transform:uppercase;
    font-size:clamp(11px,1.4vw,13px); font-weight:600;
    color: var(--gold-light);
    opacity:.9;
    text-align:center;
  }

  .date-urdu{
    font-family:'Noto Nastaliq Urdu', serif;
    font-size: clamp(20px, 2.6vw, 26px);
    margin-top: 18px;
    color: var(--cream);
    opacity:.85;
  }

  /* ---------- hero heading ---------- */
  h1{
    font-family:'Amiri', serif;
    font-weight:700;
    font-style:italic;
    text-align:center;
    font-size: clamp(38px, 7vw, 84px);
    line-height:1.05;
    margin-top: 22px;
    background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 60%, #a9790f 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow: 0 0 60px rgba(212,160,23,0.25);
    letter-spacing: .01em;
  }
  h1 .en{
    display:block;
    font-family:'Inter', sans-serif;
    font-style:normal;
    font-weight:600;
    font-size: clamp(13px, 1.6vw, 16px);
    letter-spacing:.35em;
    text-transform:uppercase;
    color: var(--cream);
    -webkit-text-fill-color: var(--cream);
    opacity:.75;
    margin-top:14px;
  }

  /* ---------- countdown ---------- */
  .countdown{
    display:flex;
    gap: clamp(10px, 3vw, 34px);
    margin-top: clamp(36px, 6vh, 64px);
    flex-wrap:wrap;
    justify-content:center;
  }
  .unit{
    display:flex; flex-direction:column; align-items:center;
    min-width: clamp(64px, 12vw, 110px);
  }
  .unit .num{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size: clamp(38px, 8vw, 76px);
    line-height:1;
    color: var(--white);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 4px 30px rgba(0,0,0,.35);
    transition: transform .25s ease;
  }
  .unit .num.tick{ animation: pop .5s ease; }
  @keyframes pop{
    0%{ transform: translateY(-6px); opacity:.4; }
    100%{ transform: translateY(0); opacity:1; }
  }
  .unit .label{
    margin-top:10px;
    font-size: clamp(10px, 1.2vw, 12px);
    letter-spacing:.25em;
    text-transform:uppercase;
    color: var(--gold-light);
    opacity:.85;
  }
  .colon{
    font-family:'Space Mono', monospace;
    font-size: clamp(30px, 6vw, 60px);
    color: var(--gold);
    opacity:.5;
    align-self:flex-start;
    margin-top: clamp(2px, .5vw, 6px);
  }

  .subline{
    margin-top: 30px;
    font-family:'Noto Nastaliq Urdu', serif;
    font-size: clamp(18px, 2.4vw, 24px);
    color: var(--cream);
    opacity:.8;
    text-align:center;
  }

  /* ---------- celebration state ---------- */
  .celebrate{ display:none; text-align:center; margin-top: clamp(36px,6vh,64px); }
  .celebrate.show{ display:block; }
  .celebrate h2{
    font-family:'Amiri', serif; font-weight:700; font-style:italic;
    font-size: clamp(34px, 6vw, 64px);
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .celebrate p{
    font-family:'Noto Nastaliq Urdu', serif;
    font-size: clamp(20px, 3vw, 30px);
    margin-top:12px; color: var(--cream);
  }

  footer{
    margin-top:auto;
    text-align:center;
    font-size:11px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color: var(--cream);
    opacity:.4;
    padding: 40px 0 28px;
  }

  @media (prefers-reduced-motion: reduce){
    .star, .unit .num.tick{ animation:none !important; }
  }
</style>
</head>
<body>

<div id="stars"></div>

<div class="page">

  <div class="eyebrow">Islamic Republic of Pakistan</div>
  <div class="date-urdu">۱۴ اگست</div>

  <h1>یومِ آزادی مبارک<span class="en">79th Independence Day &middot; August 14</span></h1>

  <div id="countdownWrap">
    <div class="countdown" id="countdown">
      <div class="unit"><div class="num" id="d">00</div><div class="label">Days</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="num" id="h">00</div><div class="label">Hours</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="num" id="m">00</div><div class="label">Minutes</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="num" id="s">00</div><div class="label">Seconds</div></div>
    </div>
    <div class="subline">پاکستان زندہ باد</div>
  </div>

  <div class="celebrate" id="celebrate">
    <h2>Happy Independence Day</h2>
    <p>یومِ آزادی مبارک ہو، پاکستان زندہ باد</p>
  </div>

  <footer>Lahore &middot; 1940 &mdash; 2026</footer>
</div>

<script>
  // starfield
  const starField = document.getElementById('stars');
  const STAR_COUNT = 70;
  for(let i=0;i<STAR_COUNT;i++){
    const s = document.createElement('div');
    s.className='star';
    s.style.left = Math.random()*100+'vw';
    s.style.top = Math.random()*70+'vh';
    s.style.animationDelay = (Math.random()*3.5)+'s';
    s.style.animationDuration = (2.5+Math.random()*3)+'s';
    starField.appendChild(s);
  }

  // countdown target: 14 August 2026, 00:00:00 Pakistan Standard Time (UTC+5)
  const target = new Date('2026-08-14T00:00:00+05:00').getTime();

  const dEl = document.getElementById('d');
  const hEl = document.getElementById('h');
  const mEl = document.getElementById('m');
  const sEl = document.getElementById('s');
  const countdownWrap = document.getElementById('countdownWrap');
  const celebrate = document.getElementById('celebrate');

  let prev = { d:null, h:null, m:null, s:null };

  function setVal(el, val, key){
    const str = String(val).padStart(2,'0');
    if(prev[key] !== str){
      el.textContent = str;
      el.classList.remove('tick');
      void el.offsetWidth;
      el.classList.add('tick');
      prev[key] = str;
    }
  }

  function tick(){
    const now = Date.now();
    const diff = target - now;

    if(diff <= 0){
      countdownWrap.style.display = 'none';
      celebrate.classList.add('show');
      clearInterval(timer);
      return;
    }

    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins = Math.floor((diff % 3600000) / 60000);
    const secs = Math.floor((diff % 60000) / 1000);

    setVal(dEl, days, 'd');
    setVal(hEl, hours, 'h');
    setVal(mEl, mins, 'm');
    setVal(sEl, secs, 's');
  }

  tick();
  const timer = setInterval(tick, 1000);
</script>

</body>
</html>
